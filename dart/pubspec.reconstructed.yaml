# 重建的 pubspec.yaml（推断）
#
# 说明：
#   * 依赖名单来自 APK 内 assets/flutter_assets/NOTICES.Z 的 197 个许可段落，
#     因此"存在性"是确定的；但**版本号无法从 AOT 产物中恢复**，故全部写 any。
#   * mpv_client 为本地 path 依赖（APK 内 Dart 包名 xyz.lhtls.mpv_client）。
#   * 本文件用于给重建工程一个可运行的起点，不是原作者的真实 pubspec。
name: re_player_ex
description: "Reex 1.8.9 reconstructed dependency manifest (reverse engineered)"
publish_to: none
version: 1.8.9+2142

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- 本地插件：mpv 绑定（JNI/FFI） ----
  mpv_client:
    path: packages/mpv_client

  flutter_riverpod: any
  riverpod: any
  dio: any
  http: any
  web_socket_channel: any
  drift: any
  drift_dev: any
  sqlite3: any
  sqlite3_flutter_libs: any
  sqlparser: any
  ftpconnect: any
  webdav_client: any
  smb2_client: any
  nsd: any
  path_provider: any
  url_launcher: any
  package_info_plus: any
  device_info_plus: any
  flutter_preferences: any
  storage_access: any
  palette_generator: any
  image: any
  archive: any
  pointycastle: any
  crypto: any
  lpinyin: any
  fuzzywuzzy: any
  string_splitter: any
  etc_decoder: any
  eva_icons_flutter: any
  flutter_colorpicker: any
  loading_animations: any
  loading_animation_widget: any
  spring_animation: any
  sliver_tools: any
  scrollable_positioned_list: any
  nested: any
  bot_toast: any
  vibration: any
  flutter_displaymode: any
  rxdart: any
  uuid: any
  xml: any
  ffi: any
  intl: any
  provider: any
  freezed_annotation: any
  json_annotation: any
  path: any
  collection: any
  meta: any
dev_dependencies:
  build_runner: any
  freezed: any
  json_serializable: any
  drift_dev: any
  riverpod_lint: any
  custom_lint: any
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/cacert.pem
  fonts:
    - family: iconfont
      fonts:
        - asset: fonts/rx_player.ttf

